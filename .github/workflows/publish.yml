name: Publish to Docker Hub

# Builds the image natively on an x86_64 and an arm64 runner, runs the same smoke test as CI,
# pushes each architecture by digest, then joins them under one multi-arch tag set:
# the release version (v2.1.0 -> 2.1.0) and `latest`.
# Needs the repository secrets DOCKER_USERNAME and DOCKER_TOKEN (a Docker Hub access token).
on:
  release:
    types: [published]
  # A PR that changes this file gets a dry run: both builds and smoke tests, nothing is pushed.
  pull_request:
    paths: [.github/workflows/publish.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish next to `latest` (e.g. 2.1.0)
        required: true
      push:
        description: Push to Docker Hub (untick to only build and smoke-test)
        type: boolean
        default: true

env:
  IMAGE: natlee/gui-vnc
  PUSH: ${{ github.event_name == 'release' || inputs.push }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: gui-vnc:smoke
      - name: Smoke test (VNC, noVNC, SSH, Xfce)
        run: .github/scripts/smoke-test.sh gui-vnc:smoke
      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Push by digest
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Save the digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        if: env.PUSH == 'true'
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          retention-days: 1

  publish:
    name: tag ${{ github.event.release.tag_name || inputs.version }} and latest
    needs: build
    if: github.event_name == 'release' || inputs.push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Create the multi-arch tags
        working-directory: digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
      - name: Show the result
        run: docker buildx imagetools inspect "$IMAGE:latest"
